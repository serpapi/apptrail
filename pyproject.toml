[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[project]
name = "apptrail"
version = "0.4.1"
description = "Open-source app visibility tracking across the App Store, Google Play, and AI search."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "serpapi>=0.1.5,<1",
  "sqlalchemy>=2.0,<3",
  "platformdirs>=4,<5",
  "filelock>=3.16,<4",
  "python-dateutil>=2.9,<3",
  "argon2-cffi>=25.1,<26",
  "pillow>=12,<13",
]

[project.scripts]
apptrail = "apptrail.cli:main"

[project.urls]
Homepage = "https://github.com/serpapi/apptrail"
Documentation = "https://github.com/serpapi/apptrail/blob/main/README.md"
Repository = "https://github.com/serpapi/apptrail"
Issues = "https://github.com/serpapi/apptrail/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11", "playwright>=1.50"]

[tool.uv.build-backend]
source-include = [
  "tests/**",
  "docs/**",
  "scripts/**",
  ".github/**",
  "uv.lock",
  "Dockerfile",
  "compose.yaml",
  ".gitignore",
  ".dockerignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real SerpApi service (requires SERPAPI_API_KEY)", "browser: opt-in local Chrome UI workflows"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
